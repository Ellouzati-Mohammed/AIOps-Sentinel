global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:

  # ==========================================================
  # Prometheus lui-même
  # ==========================================================
  - job_name: "prometheus"

    static_configs:
      - targets:
          - "prometheus:9090"



  # ==========================================================
  # OpenTelemetry Collector
  # ==========================================================
  - job_name: "otel-collector"

    static_configs:
      - targets:
          - "otel-collector:9464"



  # ==========================================================
  # Gateway Service
  # ==========================================================
  - job_name: "gateway-service"

    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "gateway-service:8080"



  # ==========================================================
  # Auth Service
  # ==========================================================
  - job_name: "auth-service"

    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "auth-service:8081"



  # ==========================================================
  # User Service
  # ==========================================================
  - job_name: "user-service"

    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "user-service:8082"



  # ==========================================================
  # Product Service
  # ==========================================================
  - job_name: "product-service"

    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "product-service:8083"