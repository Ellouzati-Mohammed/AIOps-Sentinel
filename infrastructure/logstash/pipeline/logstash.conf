input {
  beats {
    port => 5044
  }
}

output {
  http {
    url => "http://host.docker.internal:8000/api/logs"
    http_method => "post"
    format => "json_batch"
    content_type => "application/json"
  }

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "hdfs-raw-logs"
  }
}
