services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}

    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}

    ports:
      - "${ELASTIC_PORT}:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - sentinel-network

volumes:
  elasticsearch-data:

networks:
  sentinel-network:
    driver: bridge