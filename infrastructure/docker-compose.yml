services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5





  # ==========================================================
  # Elasticsearch
  # ==========================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch

    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}

    ports:
      - "${ELASTIC_PORT}:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200 >/dev/null || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 10





  # ==========================================================
  # filebeat 
  # ==========================================================
 

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.18.0
    container_name: filebeat

    user: root

    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../simulator:/logs:ro

    command:
      - filebeat
      - -e
      - --strict.perms=false

    depends_on:
      - logstash

    networks:
      - backend
    restart: unless-stopped
    

  # ==========================================================
  # frontend react 
  # ==========================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - backend

    restart: unless-stopped

     
    # ==========================================================
  # Backend FastAPI
  # ==========================================================
  backend:
    build:
      context: ../backend/aiops-api
      dockerfile: Dockerfile

    container_name: aiops-backend

    ports:
      - "${FASTAPI_PORT}:8000"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    networks:
      - backend

    restart: unless-stopped
  # ==========================================================
  # logstash 
  # ==========================================================

  logstash:
    image: docker.elastic.co/logstash/logstash:8.18.0
    container_name: logstash

    ports:
      - "5044:5044"

    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
      
    environment:
      XPACK_MONITORING_ENABLED: "false" #desactiver elastiquesearch
    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - backend

    restart: unless-stopped
# ==========================================================
# Volumes
# ==========================================================

volumes:

  postgres-data:

  redis-data:

  elasticsearch-data:

  prometheus-data:



# ==========================================================
# Networks
# ==========================================================

networks:

  backend:
    driver: bridge


    