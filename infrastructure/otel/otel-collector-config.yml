receivers:

  otlp:
    protocols:

      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318



processors:

  batch:

  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128



exporters:

  debug:
    verbosity: basic

  prometheus:
    endpoint: "0.0.0.0:9464"

  elasticsearch:
    endpoints:
      - http://elasticsearch:9200

    logs_index: aiops-logs



extensions:

  health_check:



service:

  extensions:
    - health_check

  pipelines:

    metrics:

      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - prometheus
        - debug



    logs:

      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - elasticsearch
        - debug