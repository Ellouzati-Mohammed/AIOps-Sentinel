filebeat.inputs:
  - type: filestream
    id: hdfs_logs
    enabled: true

    paths:
      - /logs/logs_hdfs.log

output.logstash:
  hosts: ["logstash:5044"]


# Buffer interne Filebeat
queue.mem:
  events: 5000
  flush.min_events: 10
  flush.timeout: 10s


monitoring.enabled: false

logging.level: error
logging.to_files: false
logging.to_syslog: false


